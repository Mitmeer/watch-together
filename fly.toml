# fly.toml app configuration file

app = 'watch-together-app'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '60s'
    method = 'GET'
    path = '/api/health'

[env]
  NODE_ENV = 'production'
  HOST = '0.0.0.0'
  PORT = '3001'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
